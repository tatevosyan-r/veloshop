<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Велосклад - вход</title>
    <style>
        body {
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui;
        }
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 2rem;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 0.7rem;
            margin: 0.5rem 0;
            border: 1px solid #ccc;
            border-radius: 1rem;
        }
        button {
            background: #2c7a4d;
            color: white;
            border: none;
            padding: 0.7rem;
            width: 100%;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .hint {
            font-size: 0.7rem;
            color: #666;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🚲 ВелоSklad</h2>
    <input type="text" id="loginUser" placeholder="Логин: veloman" autocomplete="off">
    <input type="password" id="loginPass" placeholder="Пароль: веломан">
    <button id="loginBtn">Войти</button>
    <div class="error" id="errorMsg"></div>
    <div class="hint">👉 логин: veloman (латиница)<br>👉 пароль: веломан (русские буквы)</div>
</div>

<script>
    document.getElementById('loginBtn').onclick = function() {
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        if (user === "veloman" && pass === "веломан") {
            alert("✅ Доступ разрешён! Перенаправление...");
            // Здесь можно перейти к основному приложению
            window.location.href = "ваш_основной_файл.html"; // или показать основной интерфейс
        } else {
            document.getElementById('errorMsg').innerText = 'Неверный логин или пароль. Используйте veloman / веломан';
        }
    };
</script>
</body>
</html>
